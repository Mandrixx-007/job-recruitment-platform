<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${job.title} + ' — JobHub'">Job Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-1" th:text="${job.title}">Title</h2>
                    <p class="text-muted mb-3">
                        <i class="bi bi-building"></i>
                        <span th:text="${job.company != null ? job.company.name : 'Company'}">Company</span>
                        ·
                        <i class="bi bi-geo-alt"></i> <span th:text="${job.location}">Location</span>
                    </p>

                    <div class="mb-3">
                        <span class="badge bg-primary me-1" th:text="${job.employmentType}">FULL_TIME</span>
                        <span class="badge bg-info text-dark me-1" th:if="${job.experienceLevel}" th:text="${job.experienceLevel}">MID</span>
                        <span class="badge bg-secondary" th:if="${job.category}" th:text="${job.category}">Tech</span>
                    </div>

                    <h5 class="fw-bold mt-4">Description</h5>
                    <p th:text="${job.description}">...</p>

                    <h5 class="fw-bold mt-4" th:if="${job.requirements}">Requirements</h5>
                    <p th:if="${job.requirements}" th:text="${job.requirements}">...</p>

                    <h5 class="fw-bold mt-4">Deadline</h5>
                    <p th:text="${job.deadline}">...</p>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <p class="mb-1 text-muted small">Salary</p>
                    <h5 class="fw-bold mb-3">
                        <span th:if="${job.salaryMin != null}" th:text="'₦' + ${job.salaryMin}">₦0</span>
                        <span th:if="${job.salaryMin != null and job.salaryMax != null}"> – </span>
                        <span th:if="${job.salaryMax != null}" th:text="'₦' + ${job.salaryMax}">₦0</span>
                        <span th:if="${job.salaryMin == null and job.salaryMax == null}">Negotiable</span>
                    </h5>

                    <a th:href="@{'/seeker/apply/' + ${job.id}}" class="btn btn-primary w-100 mb-2">
                        <i class="bi bi-send"></i> Apply Now
                    </a>
                    <a th:href="@{/jobs}" class="btn btn-outline-secondary w-100">Back to Jobs</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
