<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Browse Jobs — JobHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="fw-bold mb-3">Available Jobs</h3>

    <div th:if="${#lists.isEmpty(jobs)}" class="card border-0 shadow-sm">
        <div class="card-body text-center py-5">
            <i class="bi bi-search fs-1 text-muted"></i>
            <p class="text-muted mt-2 mb-0">No jobs available right now.</p>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-6" th:each="job : ${jobs}">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h5 class="fw-bold mb-1" th:text="${job.title}">Title</h5>
                    <p class="text-muted small mb-2">
                        <i class="bi bi-building"></i>
                        <span th:text="${job.company != null ? job.company.name : 'Company'}">Company</span>
                        ·
                        <i class="bi bi-geo-alt"></i>
                        <span th:text="${job.location}">Location</span>
                    </p>
                    <p class="small mb-2" th:text="${#strings.abbreviate(job.description, 120)}">Description...</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-primary" th:text="${job.employmentType}">FULL_TIME</span>
                            <span class="badge bg-info text-dark" th:if="${job.experienceLevel}" th:text="${job.experienceLevel}">MID</span>
                        </div>
                        <a th:href="@{'/jobs/' + ${job.id}}" class="btn btn-sm btn-primary">View Job</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
