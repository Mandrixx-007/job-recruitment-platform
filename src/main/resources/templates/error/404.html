<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Page Not Found — JobHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5 text-center">
    <div class="py-5">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 5rem;"></i>
        <h1 class="display-3 fw-bold mt-3">404</h1>
        <h3 class="fw-bold">Page Not Found</h3>
        <p class="text-muted">The page you're looking for doesn't exist or has been moved.</p>
        <a th:href="@{/}" class="btn btn-primary mt-3">
            <i class="bi bi-house-door"></i> Back to Home
        </a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
