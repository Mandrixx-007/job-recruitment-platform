<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Schedule Interview — JobHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <h3 class="fw-bold mb-3">Schedule Interview</h3>

            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{'/employer/applications/' + ${applicationId} + '/interview'}"
                          th:object="${interviewDto}" method="post">

                        <!-- ✅ Hidden jobId — this was missing before -->
                        <input type="hidden" name="jobId" th:value="${jobId}"/>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Date</label>
                                <input type="date" th:field="*{interviewDate}" class="form-control" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Time</label>
                                <input type="time" th:field="*{interviewTime}" class="form-control" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Type</label>
                                <select th:field="*{interviewType}" class="form-select">
                                    <option th:value="'ONLINE'">ONLINE</option>
                                    <option th:value="'IN_PERSON'">IN_PERSON</option>
                                    <option th:value="'PHONE'">PHONE</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Meeting Link (if online)</label>
                                <input type="url" th:field="*{meetingLink}" class="form-control" placeholder="https://meet.google.com/..."/>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold">Location (if in-person)</label>
                                <input type="text" th:field="*{location}" class="form-control"/>
                            </div>
                        </div>

                        <div class="mb-3 mt-3">
                            <label class="form-label small fw-semibold">Notes to Candidate</label>
                            <textarea th:field="*{notes}" rows="3" class="form-control"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-calendar-check"></i> Schedule Interview
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
