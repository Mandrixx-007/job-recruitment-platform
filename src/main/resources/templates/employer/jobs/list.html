<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>My Jobs — JobHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0">My Jobs</h3>
        <a th:href="@{/employer/jobs/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Post a Job
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

    <div th:if="${jobs == null or #lists.isEmpty(jobs)}" class="card border-0 shadow-sm">
        <div class="card-body text-center py-5">
            <i class="bi bi-inbox fs-1 text-muted"></i>
            <p class="text-muted mt-2 mb-0">You haven't posted any jobs yet.</p>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(jobs)}" class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Title</th>
                    <th>Location</th>
                    <th>Type</th>
                    <th>Deadline</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="job : ${jobs}">
                    <td class="fw-semibold" th:text="${job.title}">Title</td>
                    <td th:text="${job.location}">Location</td>
                    <td th:text="${job.employmentType}">Type</td>
                    <td th:text="${job.deadline}">Deadline</td>
                    <td>
                        <span class="badge"
                              th:classappend="${job.status.name() == 'OPEN'} ? 'bg-success' : 'bg-secondary'"
                              th:text="${job.status}">OPEN</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/employer/jobs/' + ${job.id} + '/applicants'}"
                           class="btn btn-sm btn-success">
                            <i class="bi bi-people"></i> Applicants
                        </a>
                        <a th:href="@{'/jobs/' + ${job.id}}" class="btn btn-sm btn-outline-primary">View</a>
                        <form th:action="@{'/employer/jobs/' + ${job.id} + '/close'}" method="post" class="d-inline"
                              th:if="${job.status.name() == 'OPEN'}">
                            <button class="btn btn-sm btn-outline-warning" type="submit">Close</button>
                        </form>
                        <form th:action="@{'/employer/jobs/' + ${job.id} + '/delete'}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this job?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
