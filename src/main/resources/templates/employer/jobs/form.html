<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Post a Job — JobHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="fw-bold mb-0">Post a New Job</h3>
                <a th:href="@{/employer/jobs}" class="btn btn-outline-secondary btn-sm">Back</a>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/employer/jobs/new}" th:object="${jobDto}" method="post">

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Job Title</label>
                            <input type="text" th:field="*{title}" class="form-control"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Category</label>
                                <select th:field="*{category}" class="form-select">
                                    <option th:value="''">-- Select --</option>
                                    <option th:value="'Technology'">Technology</option>
                                    <option th:value="'Engineering'">Engineering</option>
                                    <option th:value="'Finance'">Finance</option>
                                    <option th:value="'Marketing'">Marketing</option>
                                    <option th:value="'Healthcare'">Healthcare</option>
                                    <option th:value="'Education'">Education</option>
                                    <option th:value="'Other'">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Location</label>
                                <input type="text" th:field="*{location}" class="form-control" placeholder="e.g. Lagos, Nigeria"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Employment Type</label>
                                <select th:field="*{employmentType}" class="form-select">
                                    <option th:value="''">-- Select --</option>
                                    <option th:value="'FULL_TIME'">FULL_TIME</option>
                                    <option th:value="'PART_TIME'">PART_TIME</option>
                                    <option th:value="'CONTRACT'">CONTRACT</option>
                                    <option th:value="'INTERNSHIP'">INTERNSHIP</option>
                                    <option th:value="'REMOTE'">REMOTE</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Experience Level</label>
                                <select th:field="*{experienceLevel}" class="form-select">
                                    <option th:value="''">-- Select --</option>
                                    <option th:value="'ENTRY'">ENTRY</option>
                                    <option th:value="'MID'">MID</option>
                                    <option th:value="'SENIOR'">SENIOR</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Salary Min</label>
                                <input type="number" step="0.01" th:field="*{salaryMin}" class="form-control"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Salary Max</label>
                                <input type="number" step="0.01" th:field="*{salaryMax}" class="form-control"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Application Deadline</label>
                                <input type="date" th:field="*{deadline}" class="form-control"
                                       th:classappend="${#fields.hasErrors('deadline')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}"></div>
                            </div>
                        </div>

                        <div class="mb-3 mt-3">
                            <label class="form-label small fw-semibold">Description</label>
                            <textarea th:field="*{description}" rows="4" class="form-control"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Requirements</label>
                            <textarea th:field="*{requirements}" rows="4" class="form-control"></textarea>
                        </div>

                        <div th:if="${jobDto != null and #fields.hasGlobalErrors()}" class="alert alert-danger small">
                            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Publish Job</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
