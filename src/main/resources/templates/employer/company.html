<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Company Profile — JobHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h3 class="fw-bold mb-1">Company Profile</h3>
            <p class="text-muted small mb-3" th:if="${!hasCompany}">
                Set up your company details before posting jobs.
            </p>
            <p class="text-muted small mb-3" th:if="${hasCompany}">
                Update your company information.
            </p>

            <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/employer/company}" th:object="${companyDto}" method="post">

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Company Name</label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Industry</label>
                                <input type="text" th:field="*{industry}" class="form-control" placeholder="e.g. Software"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Location</label>
                                <input type="text" th:field="*{location}" class="form-control" placeholder="e.g. Lagos, Nigeria"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Website</label>
                                <input type="url" th:field="*{website}" class="form-control" placeholder="https://..."/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Logo URL</label>
                                <input type="url" th:field="*{logoUrl}" class="form-control" placeholder="https://.../logo.png"/>
                            </div>
                        </div>

                        <div class="mb-3 mt-3">
                            <label class="form-label small fw-semibold">Description</label>
                            <textarea th:field="*{description}" rows="4" class="form-control"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <span th:if="${!hasCompany}">Save &amp; Continue</span>
                            <span th:if="${hasCompany}">Update Company</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
