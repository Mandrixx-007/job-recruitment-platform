<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register — JobHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="fw-bold text-center mb-1">Create Your Account</h3>
                    <p class="text-center text-muted small mb-4">Join JobHub as a Job Seeker or Employer</p>

                    <!-- Global error (e.g. duplicate email) -->
                    <div th:if="${emailError}" class="alert alert-danger py-2 small" th:text="${emailError}"></div>

                    <form th:action="@{/register}" th:object="${registerDto}" method="post">

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label small fw-semibold">Full Name</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Email</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-semibold">Password</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label for="phone" class="form-label small fw-semibold">Phone <span class="text-muted">(optional)</span></label>
                            <input type="text" id="phone" th:field="*{phone}" class="form-control"/>
                        </div>

                        <!-- Role -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold d-block">Account Type</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="roleSeeker"
                                       th:field="*{role}" th:value="ROLE_JOB_SEEKER" required/>
                                <label class="form-check-label" for="roleSeeker">Job Seeker</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="roleEmployer"
                                       th:field="*{role}" th:value="ROLE_EMPLOYER"/>
                                <label class="form-check-label" for="roleEmployer">Employer</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Create Account</button>
                    </form>

                    <p class="text-center mt-3 mb-0 small">
                        Already have an account?
                        <a th:href="@{/login}" class="text-decoration-none">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
