<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — JobHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h3 class="fw-bold text-center mb-1">Welcome Back</h3>
                    <p class="text-center text-muted small mb-4">Log in to your JobHub account</p>

                    <!-- Success (after registration) -->
                    <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                    <!-- Error -->
                    <div th:if="${param.error}" class="alert alert-danger py-2 small">
                        Invalid email or password.
                    </div>

                    <!-- Logout confirmation -->
                    <div th:if="${param.logout}" class="alert alert-info py-2 small">
                        You have been logged out.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label small fw-semibold">Email</label>
                            <input type="email" id="username" name="username" class="form-control" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-semibold">Password</label>
                            <input type="password" id="password" name="password" class="form-control" required/>
                        </div>
                        <div class="form-check mb-3">
                            <input type="checkbox" id="remember-me" name="remember-me" class="form-check-input"/>
                            <label for="remember-me" class="form-check-label small">Remember me</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>

                    <p class="text-center mt-3 mb-0 small">
                        Don't have an account?
                        <a th:href="@{/register}" class="text-decoration-none">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
