<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Users — JobHub Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm mb-2">← Back to Dashboard</a>
    <h3 class="fw-bold mb-3">User Management</h3>

    <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.fullName}">Name</td>
                    <td th:text="${user.email}">Email</td>
                    <td>
                        <span class="badge bg-secondary" th:text="${user.role}">ROLE</span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${user.enabled} ? 'bg-success' : 'bg-danger'"
                              th:text="${user.enabled} ? 'ACTIVE' : 'DISABLED'">ACTIVE</span>
                    </td>
                    <td class="text-end">
                        <form th:action="@{'/admin/users/' + ${user.id} + '/toggle'}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${user.enabled} ? 'btn-outline-danger' : 'btn-outline-success'">
                                <span th:text="${user.enabled} ? 'Disable' : 'Enable'">Toggle</span>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
