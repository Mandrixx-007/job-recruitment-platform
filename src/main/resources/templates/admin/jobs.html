<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Jobs — JobHub Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm mb-2">← Back to Dashboard</a>
    <h3 class="fw-bold mb-3">Job Moderation</h3>

    <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Company</th>
                    <th>Posted By</th>
                    <th>Status</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="job : ${jobs}">
                    <td th:text="${job.id}">1</td>
                    <td th:text="${job.title}">Title</td>
                    <td th:text="${job.company != null ? job.company.name : '-'}">Company</td>
                    <td th:text="${job.postedBy != null ? job.postedBy.user.fullName : '-'}">By</td>
                    <td>
                        <span class="badge bg-secondary" th:text="${job.status}">OPEN</span>
                    </td>
                    <td class="text-end">
                        <form th:action="@{'/admin/jobs/' + ${job.id} + '/delete'}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this job permanently?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
