<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>My Applications — JobHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h3 class="fw-bold mb-3">My Applications</h3>

    <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

    <div th:if="${#lists.isEmpty(applications)}" class="card border-0 shadow-sm">
        <div class="card-body text-center py-5">
            <i class="bi bi-file-earmark-text fs-1 text-muted"></i>
            <p class="text-muted mt-2 mb-2">You haven't applied to any jobs yet.</p>
            <a th:href="@{/jobs}" class="btn btn-primary btn-sm">Browse Jobs</a>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(applications)}" class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Job</th>
                    <th>Company</th>
                    <th>Applied</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="app : ${applications}">
                    <td class="fw-semibold" th:text="${app.job.title}">Title</td>
                    <td th:text="${app.job.company != null ? app.job.company.name : '-'}">Company</td>
                    <td th:text="${#temporals.format(app.appliedAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                    <td>
                        <span class="badge"
                              th:classappend="${app.status.name() == 'ACCEPTED'} ? 'bg-success' :
                                             (${app.status.name() == 'REJECTED'} ? 'bg-danger' :
                                             (${app.status.name() == 'SHORTLISTED'} ? 'bg-warning text-dark' :
                                             (${app.status.name() == 'INTERVIEW'} ? 'bg-info text-dark' :
                                             (${app.status.name() == 'REVIEWING'} ? 'bg-primary' : 'bg-secondary'))))"
                              th:text="${app.status}">PENDING</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/jobs/' + ${app.job.id}}" class="btn btn-sm btn-outline-primary">View Job</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
