<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard — JobHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h2 class="fw-bold mb-1">Job Seeker Dashboard</h2>
    <p class="text-muted small">Welcome, <span th:text="${email}">user</span></p>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-3">
                <p class="text-muted small mb-1">Applied Jobs</p>
                <h3 class="fw-bold mb-0" th:text="${appliedCount} ?: 0">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-3">
                <p class="text-muted small mb-1">Shortlisted</p>
                <h3 class="fw-bold mb-0 text-warning" th:text="${shortlistedCount} ?: 0">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-3">
                <p class="text-muted small mb-1">Interviews</p>
                <h3 class="fw-bold mb-0 text-success" th:text="${interviewsCount} ?: 0">0</h3>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h5 class="fw-bold mb-1">My Applications</h5>
                <p class="text-muted mb-0 small">View the jobs you've applied to and track their status.</p>
            </div>
            <a th:href="@{/seeker/applications}" class="btn btn-primary">View Applications</a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h5 class="fw-bold mb-1">Find Jobs</h5>
                <p class="text-muted mb-0 small">Browse all open jobs and apply to positions that fit you.</p>
            </div>
            <a th:href="@{/jobs}" class="btn btn-outline-primary">Browse Jobs</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
