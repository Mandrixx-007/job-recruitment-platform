<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Profile — JobHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h3 class="fw-bold mb-1">My Profile</h3>
            <p class="text-muted small mb-3">
                Update your profile information. Employers will see this when you apply.
            </p>

            <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/seeker/profile}" th:object="${profileDto}" method="post">

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Professional Title</label>
                            <input type="text" th:field="*{professionalTitle}" class="form-control"
                                   placeholder="e.g. Full Stack Developer"/>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Years of Experience</label>
                                <input type="number" th:field="*{yearsOfExperience}" class="form-control" min="0"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Location</label>
                                <input type="text" th:field="*{location}" class="form-control" placeholder="e.g. Lagos, Nigeria"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Profile Picture URL</label>
                                <input type="url" th:field="*{profilePictureUrl}" class="form-control" placeholder="https://..."/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">CV URL</label>
                                <input type="url" th:field="*{cvUrl}" class="form-control" placeholder="https://drive.google.com/..."/>
                            </div>
                        </div>

                        <div class="mb-3 mt-3">
                            <label class="form-label small fw-semibold">Biography</label>
                            <textarea th:field="*{biography}" rows="5" class="form-control"
                                      placeholder="Tell employers a bit about yourself..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-save"></i> Save Profile
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
