<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Apply — JobHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h3 class="fw-bold mb-1">Apply to <span th:text="${job.title}">Job</span></h3>
            <p class="text-muted small mb-3">
                <i class="bi bi-building"></i>
                <span th:text="${job.company != null ? job.company.name : ''}">Company</span>
                ·
                <i class="bi bi-geo-alt"></i> <span th:text="${job.location}">Location</span>
            </p>

            <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{'/seeker/apply/' + ${job.id}}" th:object="${applicationDto}" method="post">

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">CV URL (Google Drive / Dropbox / etc.)</label>
                            <input type="url" th:field="*{cvUrl}" class="form-control" placeholder="https://..."
                                   th:classappend="${#fields.hasErrors('cvUrl')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('cvUrl')}" th:errors="*{cvUrl}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Cover Letter</label>
                            <textarea th:field="*{coverLetter}" rows="6" class="form-control"
                                      th:classappend="${#fields.hasErrors('coverLetter')} ? 'is-invalid'"
                                      placeholder="Tell the employer why you're a great fit..."></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('coverLetter')}" th:errors="*{coverLetter}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-send"></i> Submit Application
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
